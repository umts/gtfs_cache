# <% def user_for(host) = Net::SSH::Config.for(host).fetch(:user, ENV.fetch('USER', nil)) %>

service: %%REPLACE_ME%%
image: umts/%%REPLACE_ME%%
registry:
  server: ghcr.io
  username: not_needed
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
  provenance: false
  sbom: false
labels:
  org.opencontainers.image.source: "https://github.com/umts/%%REPLACE_ME%%"
servers:
  web:
    - %%REPLACE_ME%%
proxy:
  ssl: true
  host: %%REPLACE_ME%%
env:
  clear:
    TZ: America/New_York
  secret:
    - MASTER_KEY
ssh:
  user: <%= user_for '%%REPLACE_ME%%' %>
volumes:
  - "%%FILL_ME_IN%%"
